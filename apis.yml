name: MFellows
description: >-
  Money Fellows (moneyfellows.com) is an Egyptian fintech that digitizes the
  traditional rotating savings and credit association (ROSCA, or "gam'eya") into
  app-based "money circles." Over 8 million users save collectively and access
  payouts and credit through flexible 6, 10, or 12-month circles, with loan
  amounts up to 1,200,000 EGP, plus a cashback debit card and goal-based savings.
  The company is regulated by the Central Bank of Egypt and backed by 500 Global.
  Money Fellows is a consumer (B2C) mobile-first product and publishes no public
  developer API, SDKs, or developer portal; the only machine-discoverable surface
  on the domain is the Umbraco CMS OpenID Connect / OAuth 2.0 member-auth server
  that backs the marketing website. This profile was surfaced as a 500 Global
  portfolio lead and enriched by the API Evangelist pipeline.
